<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: transparent; }
  canvas { image-rendering: pixelated; display: block; }
  #logo { width: 1024px; height: 1024px; }
  #og { width: 1200px; height: 630px; position: relative; background: #0b1020; background-image: linear-gradient(#111a33 2px, transparent 2px), linear-gradient(90deg, #111a33 2px, transparent 2px); background-size: 40px 40px; overflow: hidden; }
  #og .t { position: absolute; left: 70px; top: 110px; font-family: Silkscreen, monospace; font-weight: 700; font-size: 118px; line-height: 1; color: #5ef2ff; text-shadow: 7px 0 #1c2240, -7px 0 #1c2240, 0 7px #1c2240, 0 -7px #1c2240, 7px 7px #1c2240, -7px -7px #1c2240, 7px -7px #1c2240, -7px 7px #1c2240, 18px 18px 0 #060a16; }
  #og .s { position: absolute; left: 76px; top: 270px; font-family: "Pixelify Sans", monospace; font-weight: 600; font-size: 36px; color: #f3f6ff; text-shadow: 5px 5px 0 #060a16; width: 520px; line-height: 1.2; }
  #og .k { position: absolute; left: 76px; top: 470px; display: flex; gap: 16px; }
  #og .k span { font-family: Silkscreen, monospace; font-size: 22px; text-transform: uppercase; background: #f7c948; color: #1c2240; border: 6px solid #1c2240; padding: 12px 18px; box-shadow: 8px 8px 0 #1c2240; }
  #og .k span.b { background: #b58cf0; } #og .k span.c { background: #3ddc6a; }
  #og canvas { position: absolute; right: 40px; top: 40px; width: 560px; height: 560px; }
</style></head><body>
<canvas id="logo" width="256" height="256"></canvas>
<div id="og"><div class="t">LAYERS</div><div class="s">launch your L2 on a memecoin. depth 0 → 1 → 2. everything settles to $L1.</div><div class="k"><span>launch</span><span class="b">settle</span><span class="c">burn</span></div><canvas id="ogc" width="256" height="256"></canvas></div>
<script src="sprite.js"></script>
<script src="scene.js"></script>
<script>
/// the logo: a stack of blocks on a board — $L1 slab, two L2s, one L3, SOL pads in the board
function logo(c, framed) {
  const ctx = c.getContext("2d"), W = c.width, H = c.height; ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#0b1020"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#111a33"; for (let x = 0; x < W; x += 32) ctx.fillRect(x, 0, 2, H); for (let y = 0; y < H; y += 32) ctx.fillRect(0, y, W, 2);
  if (framed) { ctx.fillStyle = "#1c2240"; ctx.fillRect(0, 0, W, 12); ctx.fillRect(0, H - 12, W, 12); ctx.fillRect(0, 0, 12, H); ctx.fillRect(W - 12, 0, 12, H); ctx.fillStyle = "#5ef2ff"; ctx.fillRect(12, 12, W - 24, 6); }
  ctx.fillStyle = "#141a2e"; ctx.fillRect(12, H - 60, W - 24, 48); ctx.fillStyle = "#1c2240"; ctx.fillRect(12, H - 62, W - 24, 4);
  ctx.fillStyle = "#1f2a4a"; for (let i = 0; i < 8; i++) { const x = 20 + i * 30; ctx.fillRect(x, H - 50 + (i % 3) * 8, 22, 3); ctx.fillRect(x + 22, H - 50 + (i % 3) * 8, 3, 10); }
  const cx = W / 2, base = H - 62, s = 4;
  drawBlock(ctx, cx - 92, base - 44, 184, 40, s, skinFor(5));
  ctx.fillStyle = "#0b1020"; ctx.font = "bold 22px Silkscreen, monospace"; ctx.textAlign = "center"; ctx.fillText("$L1", cx, base - 14);
  drawBlock(ctx, cx - 76, base - 44 - 14 - 34, 60, 34, s, depthSkin(1)); drawBlock(ctx, cx + 8, base - 44 - 14 - 34, 60, 34, s, depthSkin(1));
  drawBlock(ctx, cx + 20, base - 44 - 14 - 34 - 12 - 26, 36, 26, s, depthSkin(2));
  for (const [x, y, col] of [[cx - 54, base - 84, "#ff5c5c"], [cx + 30, base - 84, "#62a8ea"], [cx + 32, base - 124, "#f7c948"]]) { ctx.fillStyle = "#1c2240"; ctx.fillRect(x - 2, y - 2, 20, 20); ctx.fillStyle = col; ctx.fillRect(x, y, 16, 16); ctx.fillStyle = "#ffffff"; ctx.fillRect(x + 3, y + 3, 4, 4); }
  // a packet falling into the slab
  drawPix(ctx, PACKET, cx - 10, base - 44 - 14 - 34 - 60, 4);
  drawPix(ctx, COIN, 30, H - 40, 2.4, SOLCOIN); drawPix(ctx, COIN, W - 54, H - 36, 2.4, SOLCOIN);
}
logo(document.getElementById("logo"), true); logo(document.getElementById("ogc"), true);
</script></body></html>
