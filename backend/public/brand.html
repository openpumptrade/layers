<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style> body { margin: 0; background: #06070a; } canvas { display: block; margin: 20px; } </style></head><body>
<canvas id="logo" width="1024" height="1024"></canvas>
<canvas id="og" width="1200" height="630"></canvas>
<script>
// the glyph: four bars, L4 → L1 from the top, widening down (the stack), on black
function glyph(ctx, x, y, s) { // s = unit size; total 22s × 22s
  const bars = [["#ff5cf0", 10, 4], ["#ffb020", 15, 4], ["#7cff6b", 20, 4], ["#e6e8ef", 22, 5]];
  let yy = y + 22 * s;
  for (const [col, w, h] of bars.slice().reverse()) { yy -= h * s; ctx.fillStyle = col; ctx.fillRect(x + (22 - w) / 2 * s, yy, w * s, h * s); yy -= 2 * s; }
}
async function render() {
  await document.fonts.load("700 160px 'Space Grotesk'"); await document.fonts.load("400 30px 'JetBrains Mono'"); await document.fonts.ready;
  // icon: black square, the glyph centered
  const L = document.getElementById("logo"), lc = L.getContext("2d");
  lc.fillStyle = "#06070a"; lc.fillRect(0, 0, 1024, 1024);
  lc.strokeStyle = "#1c2029"; lc.lineWidth = 8; lc.strokeRect(4, 4, 1016, 1016);
  glyph(lc, 512 - 11 * 30, 512 - 11 * 30, 30);
  // og: wordmark + tagline + glyph + a stack diagram
  const O = document.getElementById("og"), c = O.getContext("2d");
  c.fillStyle = "#06070a"; c.fillRect(0, 0, 1200, 630);
  c.strokeStyle = "#161a23"; c.lineWidth = 1; for (let y = 0.5; y < 630; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(1200, y); c.stroke(); }
  glyph(c, 70, 70, 3);
  c.fillStyle = "#e6e8ef"; c.font = "700 150px 'Space Grotesk', sans-serif"; c.textBaseline = "top"; c.textAlign = "left"; c.fillText("LAYERS", 60, 130);
  c.font = "400 30px 'JetBrains Mono', monospace"; c.fillStyle = "#e6e8ef"; c.fillText("stack coins on coins.", 70, 320);
  c.fillStyle = "#7b8294"; c.font = "400 22px 'JetBrains Mono', monospace"; c.fillText("launch a layer on a memecoin: an L2, an L3, as high as pump.fun allows.", 70, 372); c.fillText("every settlement burns the coin + the layer below.", 70, 404); c.fillText("everything settles to $L1.", 70, 436);
  // a small stack diagram, bottom right
  const bx = 830, by = 310, w = 330;
  const block = (x, y, bw, h, col, label) => { c.fillStyle = "#0f1218"; c.fillRect(x, y, bw, h); c.strokeStyle = col; c.strokeRect(x + 0.5, y + 0.5, bw - 1, h - 1); c.fillStyle = col; c.fillRect(x, y, bw, 3); if (label) { c.fillStyle = "#e6e8ef"; c.font = "600 16px 'JetBrains Mono', monospace"; c.textBaseline = "middle"; c.fillText(label, x + 12, y + h / 2); } };
  block(bx, by + 200, w, 56, "#e6e8ef", "$L1");
  for (const [i, l] of [["$L2", 0, 130], ["$L2", 145, 90], ["$L2", 250, 80]].entries()) block(bx + l[1], by + 110, l[2], 48, "#7cff6b", l[0]);
  block(bx + 10, by + 30, 70, 40, "#ffb020", "$L3"); block(bx + 90, by + 30, 50, 40, "#ffb020", ""); block(bx + 175, by + 30, 80, 40, "#ffb020", "$L3");
  c.strokeStyle = "#272d3a"; for (const x of [bx + 65, bx + 190, bx + 290]) { c.beginPath(); c.moveTo(x, by + 158); c.lineTo(x, by + 200); c.stroke(); }
  for (const x of [bx + 45, bx + 115, bx + 215]) { c.beginPath(); c.moveTo(x, by + 70); c.lineTo(x, by + 110); c.stroke(); c.fillStyle = "#ffb020"; c.fillRect(x - 1, by + 80, 2, 8); }
  c.fillStyle = "#7cff6b"; c.fillRect(bx + 64, by + 170, 2, 8); c.fillRect(bx + 289, by + 180, 2, 8);
  c.fillStyle = "#4a5160"; c.font = "400 14px 'JetBrains Mono', monospace"; c.textBaseline = "top"; c.fillText("SOL", bx, by + 270); c.textAlign = "right"; c.fillText("stack explorer · pump.fun · solana", bx + w, by + 270);
  c.fillStyle = "#7cff6b"; c.fillRect(0, 0, 1200, 4);
  window.__done = true;
}
render();
</script></body></html>
